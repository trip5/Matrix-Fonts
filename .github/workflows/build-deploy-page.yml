
name: Build and Deploy GitHub Page

on:
  workflow_run:
    workflows: ["Build Page"]
    types:
      - completed
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install mkdocs-material==9.7.7

      - name: Stage docs from README
        run: |
          mkdir -p docs
          cp README.md docs/index.md
          cp -r images docs/

      - name: Update GitHub link in documentation index
        run: |
          # Replace only the first occurrence of 'Github Page' with 'Github Repository'
          sed -i '0,/Github Page/s|Github Page|Github Repository|' docs/index.md
          # Replace only the first occurrence of the link after that phrase with the correct repo link
          sed -i "0,/(https:\/\/[^)]*)/s|(https://[^)]*)|(https://github.com/${{ github.repository }})|" docs/index.md
          # Replace only the first occurrence of 'easier to read' with 'easier to explore'
          sed -i '0,/easier to read/s|easier to read|easier to explore|' docs/index.md

      - name: Convert relative repo links to GitHub URLs
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          BASE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${DEFAULT_BRANCH}"
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${DEFAULT_BRANCH}"
          #
          # 1. Asset targets (images, media, archives) go to RAW urls, and must be done
          #    first: a blob url is an HTML page, so it renders as a broken image in
          #    ![alt](image.png) or ![alt](./dir/pic.png), whereas a raw url is the
          #    image bytes themselves.  The rewritten urls contain a colon, so the
          #    repo-file rewrite below leaves them alone.
          #    NOTE: '%' is the s delimiter here, not '|', because the pattern below
          #    uses '|' for alternation.  A leading './' is dropped so the raw url is
          #    repo-root relative.
          sed -i -E "s%]\((\./)?([^)#:/][^)#:]*\.(png|jpe?g|gif|webp|avif|svg|ico|bmp|mp4|webm|pdf|zip|apk))\)%](${RAW}/\2)%gI" docs/index.md
          #
          # 2. Any other repo-relative target becomes a blob url.  MkDocs only resolves
          #    links between documentation pages, so repo files such as
          #    [LICENSE](LICENSE) would 404 on the site.  A target without a colon is
          #    repo-relative; anything containing ':' (https:, mailto:), starting with
          #    a '#' anchor or starting with '/' (site-absolute) is left untouched.
          #    Nothing is hardcoded, so forks rewrite against their own repo + branch.
          sed -i -E "s|]\(([^)#/][^):]*)\)|](${BASE}/\1)|g" docs/index.md
          echo "Asset links rewritten against ${RAW}/"
          echo "Repo file links rewritten against ${BASE}/"

      - name: Copy BDF font files to docs
        run: |
          cp -r 6-series docs/
          cp -r 8-series docs/

      - name: Build documentation
        run: mkdocs build --strict

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-deploy
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
